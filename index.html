<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3eee6" />
  <meta name="description" content="Oppslag – norsk telefonkatalog, offline-først, mobilvennlig" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Oppslag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <button type="button" class="menu-btn" id="menu-btn" aria-label="Meny" aria-expanded="false">⋯</button>
  <div class="popup" id="popup" role="menu">
    <button type="button" id="theme-papir">Tema: Papir</button>
    <button type="button" id="theme-natt">Tema: Natt</button>
    <button type="button" id="theme-kart">Tema: Kart</button>
    <div class="sep"></div>
    <button type="button" id="toggle-examples">Vis / skjul eksempler</button>
    <button type="button" id="add-contact">Legg til kontakt</button>
    <div class="sep"></div>
    <a href="https://data.brreg.no/enhetsregisteret/api/docs/index.html" target="_blank" rel="noopener">Om Brreg-API</a>
  </div>

  <div class="shell">
    <header>
      <div>
        <h1>Oppslag</h1>
        <p>Norsk katalog · offline-først</p>
      </div>
    </header>

    <div class="search-wrap">
      <input type="search" id="q" placeholder="Navn, nummer, postnr …" autocomplete="off" enterkeyhint="search" aria-label="Søk" />
      <button type="button" class="clear" id="clear-btn" aria-label="Tøm">×</button>
    </div>

    <div class="chips">
      <button type="button" class="chip" data-q="Victoria">Victoria</button>
      <button type="button" class="chip" data-q="Johnny D*">Johnny D*</button>
      <button type="button" class="chip" data-q="*ar* * *e">*ar* * *e</button>
      <button type="button" class="chip" data-q="Svein Morten * 0683">Svein Morten * 0683</button>
      <button type="button" class="chip" data-q="Bill">Bill</button>
      <button type="button" class="chip" data-q="Vinmonopolet">Vinmonopolet</button>
    </div>

    <p class="status" id="status" aria-live="polite"></p>
    <div id="results" role="list"></div>
  </div>

  <div class="dialog-backdrop" id="dialog-backdrop">
    <div class="dialog" id="add-dialog" role="dialog" aria-labelledby="add-title">
      <h2 id="add-title">Ny kontakt</h2>
      <label for="add-name">Navn</label>
      <input id="add-name" type="text" autocomplete="name" />
      <label for="add-phone">Telefon</label>
      <input id="add-phone" type="tel" inputmode="tel" autocomplete="tel" />
      <label for="add-post">Postnummer</label>
      <input id="add-post" type="text" inputmode="numeric" maxlength="4" />
      <div class="row">
        <button type="button" id="add-cancel">Avbryt</button>
        <button type="button" class="primary" id="add-save">Lagre</button>
      </div>
    </div>
  </div>

  <script src="js/match.js"></script>
  <script src="js/book.js"></script>
  <script src="js/brreg.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
